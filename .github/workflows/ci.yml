# ============================================================================
# Scribae — intégration continue (GitHub Actions).
#
# OÙ VIT CE FICHIER. Le dépôt est servi tel quel (GitHub Pages) : sa racine
# porte le code de l'application (`src/`) et l'outillage (`scripts/`, `tests/`).
# Le présent fichier est le modèle de `<racine>/.github/workflows/ci.yml`, où
# l'export le dépose (comme `src/docs/GITHUB.md` devient `README.md`). Voir
# `src/docs/INDUSTRIALISATION.md`.
#
# CE QU'IL FAIT. Rien à installer pour le premier travail : la vérification de
# syntaxe, le contrôle de style et les tests des modules purs n'utilisent que
# Node. Les trois étapes sont SÉPARÉES pour qu'un échec dise du premier coup
# lequel des trois a lâché — une chaîne rouge dont personne ne distingue la
# cause ne rend pas le service qu'une chaîne rend (audit, NC-I-008).
#
#   syntaxe    `node --check` sur tout le JavaScript du dépôt ;
#   style      le contrôle de style en mode STRICT : les avertissements font
#              échouer (un import jamais employé, un `console.log` de client) ;
#   tests      les épreuves des modules purs (`tests/`) et celles du domaine du
#              service (`src/server/mysql/`, `src/server/charge/`).
#
# LE QUATRIÈME TRAVAIL REJOUE LES PARCOURS CRITIQUES DANS UN VRAI NAVIGATEUR
# (`tests/parcours-navigateur.mjs`, audit NC-I-002). C'est le seul travail qui
# ait besoin d'un navigateur, et le seul qui puisse dire ce qu'un agent VOIT :
# les épreuves pures et le domaine du service sont verts quand un écran entier
# ne s'ouvre pas — les deux défauts de la 1.6.1 en sont la preuve. Il est
# AVISANT pour l'instant (`continue-on-error`), voir son commentaire plus bas.
#
# LE TROISIÈME TRAVAIL CONSTRUIT L'IMAGE DOCKER ET LA MET EN SERVICE, sur une
# vraie MariaDB : c'est la seule chose que l'atelier ne peut pas faire, et c'est
# pourtant ce qui décide si « ça marche en production ». Il ne pousse aucune
# image (aucun secret, aucun registre) : il répond à la question « le
# `Dockerfile` se construit-il encore, et le service répond-il, base comprise ? »
# — la question que se pose un exploitant au moment de déployer. Il vérifie
# aussi les deux choses qui, silencieusement, cassent une installation :
# `npm ci` sur le verrou (`package-lock.json` en phase avec `package.json`) et
# l'application du SCHÉMA et des MIGRATIONS (`GET /v1/db/health` interroge la
# base, là où `GET /v1/health` ne prouve que le processus).
#
# Le second travail installe `mysql2` : il le fait par `npm ci`, sur le verrou
# `src/server/mysql/package-lock.json` (chaque paquet épinglé, empreinte SHA-512
# vérifiée) — c'est ce qui rend deux constructions identiques. `npm ci` exige
# que le verrou soit à jour vis-à-vis de `package.json` : ajouter une dépendance
# demande donc un `npm install` local, et le commit du verrou qui va avec.
# ============================================================================
name: Intégration continue

on:
  push:
  pull_request:
  # Ce déclencheur permet de REJOUER la chaîne sans rien livrer — utile quand un
  # travail a échoué pour une raison d'environnement, et pour relire l'état d'un
  # dépôt qu'on n'a pas touché.
  workflow_dispatch:

permissions:
  contents: read

# CE QUE FAIT LA CHAÎNE QUAND ELLE ÉCHOUE. `node --test` écrit son verdict dans
# le journal du travail, et ce journal n'est lisible que par un administrateur du
# dépôt : qui voit la chaîne rouge n'apprend pas QUELLE épreuve a lâché, ni
# pourquoi. Une chaîne rouge dont personne ne distingue la cause ne rend pas le
# service qu'une chaîne rend (audit, NC-I-008). Les deux travaux d'épreuves
# passent donc leur journal à `scripts/annoncer-echecs.sh`, qui transforme
# chaque épreuve rouge en ANNOTATION (« ::error:: ») : les annotations sont
# attachées au commit, visibles dans l'onglet Checks, et interrogeables par
# l'API publique — donc lisibles par quiconque, pas seulement par le dépôt.
# Le déclencheur `workflow_dispatch` permet de REJOUER la chaîne sans rien
# livrer, ce qui est la façon de relire un échec qu'on vient de corriger.
jobs:
  verifier:
    name: Syntaxe, style et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Vérifier la syntaxe de tout le JavaScript
        run: npm run syntaxe
      - name: Contrôle de style (aucun avertissement toléré)
        run: npm run style
      # LES ÉPREUVES DU DOMAINE VIVENT SOUS `src/server/mysql/` ET SONT AUSSI
      # EXÉCUTÉES ICI (`npm test` les inclut) : leurs dépendances doivent donc
      # être installées, sinon `node --test` échouerait sur un module manquant
      # plutôt que sur une épreuve — et personne ne saurait pourquoi.
      - name: Installer les dépendances du service (`npm test` couvre son domaine)
        run: npm ci --no-audit --no-fund --prefix src/server/mysql
      - name: Tests (modules purs et domaine du service)
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/epreuves.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            bash "$GITHUB_WORKSPACE/scripts/annoncer-echecs.sh" "$RUNNER_TEMP/epreuves.log"
          fi
          exit "$code"

  service:
    name: Service auto-hébergé
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/server/mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer les dépendances du service
        run: npm ci --no-audit --no-fund
      - name: Tests du domaine des comptes et de la signature
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/epreuves-service.log"
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            # LE CHEMIN EST ANCRÉ À LA RACINE (`$GITHUB_WORKSPACE`), jamais
            # relatif : ce travail s'exécute depuis `src/server/mysql` (voir
            # `defaults` ci-dessus), et un `../../scripts/…` y désigne
            # `src/scripts/…` — qui n'existe que dans l'atelier. La CI
            # répondait donc `127` (script introuvable) au lieu d'annoter
            # l'épreuve rouge, et le travail « Service auto-hébergé » échouait
            # sans jamais dire pourquoi (le pendant, côté service, de NC-I-009).
            bash "$GITHUB_WORKSPACE/scripts/annoncer-echecs.sh" "$RUNNER_TEMP/epreuves-service.log"
          fi
          exit "$code"

  image:
    name: Image Docker, construite et mise en service
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # UNE VRAIE BASE, le temps de l'épreuve : c'est elle qui reçoit le schéma et
    # les migrations, et sans elle « le service répond » ne veut rien dire.
    services:
      db:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: racine-ci
          MARIADB_DATABASE: scriba
          MARIADB_USER: scriba
          MARIADB_PASSWORD: service-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      # Le contexte est la RACINE du dépôt, comme le documente le Dockerfile.
      - name: Construire l'image autonome
        run: docker build -f src/server/Dockerfile -t scribae:ci .
      # `--network host` : le conteneur atteint MariaDB par 127.0.0.1 et nginx
      # écoute le port 80 de la machine. `AUTO_MIGRATE` et `DB_ROOT_PASSWORD`
      # sont tous deux fournis — le premier applique schéma et migrations au
      # démarrage du service, le second aligne le compte au passage.
      - name: Mettre l'image en service
        run: |
          docker run -d --name scribae --network host --init \
            -e DB_HOST=127.0.0.1 -e DB_PORT=3306 \
            -e DB_USER=scriba -e DB_PASSWORD=service-ci -e DB_NAME=scriba \
            -e DB_ROOT_PASSWORD=racine-ci -e AUTO_MIGRATE=true \
            -e AUTH_MODE=demo -e DEMO=true -e DEMO_ACCOUNTS=true \
            -e COOKIE_SECURE=false \
            scribae:ci
      - name: Attendre la santé, puis éprouver la façade et l'API
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost/v1/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "— le service répond :"; curl -fsS http://localhost/v1/health; echo
          echo "— la base répond (schéma et migrations appliqués) :"; curl -fsS http://localhost/v1/db/health; echo
          echo "— la coquille est servie :"; curl -fsS -o /dev/null -w "  %{http_code}\n" http://localhost/
          echo "— le code de l'application est servi :"; curl -fsS -o /dev/null -w "  %{http_code}\n" http://localhost/src/lib/version.js
          echo "— config.js est engendré depuis l'environnement :"; curl -fsS http://localhost/config.js; echo
      - name: Journal du conteneur (l'épreuve a échoué)
        if: failure()
        run: docker logs scribae || true
      - name: Arrêter
        if: always()
        run: docker rm -f scribae || true

  parcours:
    name: Parcours critiques, dans un vrai navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # AVISANT, ET POURQUOI. Ce travail rejoue `tests/parcours.mjs` — les
    # parcours critiques — sur l'application réelle, montée en édition statique
    # dans un Chromium sans interface (voir `tests/parcours-navigateur.mjs`).
    # C'est le seul travail qui puisse dire ce qu'un agent VOIT, et il vient
    # d'être écrit : le rendre bloquant ferait rougir la chaîne pour une cause
    # qui n'est pas encore celle du dépôt. Ses échecs s'affichent donc en
    # ANNOTATIONS sans arrêter la livraison. À RETIRER dès qu'il aura été vu
    # vert deux fois de suite : un avertissement permanent ne se lit plus.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # RIEN N'ENTRE DANS LE DÉPÔT. Playwright est installé HORS VERROU
      # (`--no-save --no-package-lock`) et son navigateur dans le cache de la
      # machine : `npm ci` reste reproductible et `package-lock.json` ne bouge
      # pas — ajouter une dépendance de navigateur au verrou obligerait à
      # regénérer le verrou à chaque montée de version de Chromium.
      - name: Installer Playwright (hors verrou) et son navigateur
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.49.1
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Rejouer les parcours critiques
        run: node tests/parcours-navigateur.mjs
      # Une image, parce qu'aucune annotation ne dit ce qui était à l'écran.
      - name: Capture d'écran de l'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parcours-echec
          path: parcours-echec.png
          if-no-files-found: ignore
          retention-days: 7
