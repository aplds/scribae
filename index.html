  if (!saveDb(db)) { delete db.publies[cle]; return err(507, "Le service n'a plus de place disponible."); }
  const versions = versionsOf(eliUri).map((p) => resumePublication(p, false));
  return ok(201, {
    cle, eli: eliUri, eliUri, url: rec.url,
    numero: rec.numero, nature: rec.nature, objet: rec.objet,
    themeId: rec.themeId, themeLabel: rec.themeLabel,
    dateDocument, datePublication, dateOpposabilite: rec.dateOpposabilite,
    opposabilite: rec.opposabiliteRule,
    recueil: rec.recueil,
    epingle: rec.epingle === true,
    reserve: rec.reserve === true,
    informative: rec.informative === true,
    juridique: rec.juridique === false ? false : undefined,
    natureDoc: rec.natureDoc || undefined,
    adoption: rec.adoption || null,
    versions,
    ressource: "/v1/publications/" + encodeURIComponent(cle),
    original: rec.original ? { format: rec.original.format, sha256: rec.original.sha256, signatures: (rec.signature && rec.signature.signataires || []).length, href: rec.original.signaturesUrl } : null,
    // Circuit externe : la version signée (PDF) et la certification du réviseur,
    // renvoyées dès la publication — le client les affiche sans relire le
    // registre. Absent d'un acte du circuit électronique.
    originalExterne: rec.originalExterne || null,
    formats: ["text/html", "application/akn+xml", "application/ld+json"].concat(rec.original ? [rec.original.format] : []),
  }, { location: "/v1/publications/" + encodeURIComponent(cle) });
}

// Le RETRAIT d'une publication. Geste EXCEPTIONNEL : un acte administratif
// publié ne se retire pas. Seul un motif technique le justifie — dépôt en
// double, erreur de dépôt, acte publié avant d'être signé, identifiant attribué
// à tort. Un acte dont le retrait se justifierait autrement (illégalité,
// annulation) se modifie ou s'abroge : il reste au recueil, avec son
// historique. Le service exige donc un motif écrit et le conserve sur l'acte :
// le retrait laisse une trace, même une fois la publication ôtée.
//
// L'acte redevient « signé » (donc publiable de nouveau), et la publication
// disparaît du registre et du recueil. Les versions antérieures éventuelles
// d'un même ELI, elles, ne sont pas touchées : on ne retire que la version
// désignée.
function hRetirerPublication(ctx) {
  const cle = decodeURIComponent(ctx.params.cle);
  const p = lirePublication(cle);
  if (!p) return err(404, "Publication inconnue : " + cle, { code: "publication_inconnue" });
  const motif = String((ctx.body && ctx.body.motif) || "").trim();
  if (motif.length < 8) {
    return err(422, "Un retrait de publication exige un motif technique explicite.", { code: "motif_absent" });
  }
  const auteur = String((ctx.body && ctx.body.auteur) || "").slice(0, 120);
  const acte = Object.keys(db.actes).map((k) => db.actes[k])
    .find((a) => a.publication === cle || (p.acteId && a.id === p.acteId)) || null;
  const avant = acte ? { statut: acte.statut, publication: acte.publication, retraits: acte.retraits } : null;
  delete db.publies[cle];
  if (acte) {
    acte.retraits = (acte.retraits || []).concat([{ cle, motif: motif.slice(0, 400), auteur, le: nowIso() }]);
    acte.publication = null;
    if (acte.statut === "publie") acte.statut = "signee";
  }
  journaliser("publication_retiree", cle + " — motif : " + motif.slice(0, 200));
  if (!saveDb(db)) {
    // Rien n'a été écrit : on remet la mémoire dans l'état d'avant.
    db.publies[cle] = p;
    if (acte && avant) { acte.statut = avant.statut; acte.publication = avant.publication; acte.retraits = avant.retraits; }
    return err(507, "Le service n'a plus de place disponible.");
  }
  return ok(200, {
    cle, numero: p.numero, eliUri: p.eliUri, motif,
    acteId: acte ? acte.id : null, statut: acte ? acte.statut : null,
    retraits: acte ? acte.retraits.length : 0,
    ressource: "/v1/actes/" + (acte ? acte.id : ""),
    journal: "Retrait de la publication du recueil — motif technique : " + motif.slice(0, 200),
  });
}

// ÉPINGLER un acte au recueil : le mettre en avant sur sa page d'accueil (la
// bande « À la une » — la place d'un règlement intérieur, d'une charte). Le
// geste ne touche pas au texte déposé : il ne fait que lever ou poser un
// drapeau, et se défait aussi simplement qu'il s'est fait.
//
// Le drapeau suit l'ACTE — son identifiant ELI — et non la version publiée :
// on le pose donc sur TOUTES les versions publiées sous cet identifiant, et
// une version publiée plus tard l'hérite (voir hPublier). Un acte qu'on
// modifie reste ainsi « à la une ».
function hEpinglerPublication(ctx) {
  const cle = decodeURIComponent(ctx.params.cle);
  const p = lirePublication(cle);
  if (!p) return err(404, "Publication inconnue : " + cle, { code: "publication_inconnue" });
  const epingle = !!(ctx.body && ctx.body.epingle);
  const auteur = String((ctx.body && ctx.body.auteur) || "").slice(0, 120);
  const versions = versionsOf(p.eliUri);
  const avant = versions.map((v) => ({ epingle: v.epingle, epingleLe: v.epingleLe, epinglePar: v.epinglePar }));
  for (const v of versions) { v.epingle = epingle; v.epingleLe = nowIso(); v.epinglePar = auteur; }
  journaliser(epingle ? "publication_epinglee" : "publication_desepinglee", p.eliUri + " — " + versions.length + " version(s)");
  if (!saveDb(db)) {
    // Rien n'a été écrit : on remet la mémoire dans l'état d'avant.
    versions.forEach((v, i) => Object.assign(v, avant[i]));
    return err(507, "Le service n'a plus de place disponible.");
  }
  return ok(200, {
    ...resumePublication(p, latestOf(p.eliUri) === p),
    epingle, versions: versions.length,
    ressource: "/v1/publications/" + encodeURIComponent(cle),
  });
}

function hResoudreEli(ctx) {
  const eliUri = eliKey(ctx.params);
  const versions = versionsOf(eliUri).filter((p) => visiblePour(p, ctx.agent));
  if (!versions.length) return err(404, "Aucune publication ne porte l'identifiant " + eliUri + ".", { code: "eli_inconnu" });
  const enVigueur = versions[versions.length - 1];
  return ok(200, {
    eli: eliUri, eliUri, enVigueur: resumePublication(enVigueur, true),
    versions: versions.map((p, i) => resumePublication(p, i === versions.length - 1)),
    texte: { html: enVigueur.formats.html, akn: enVigueur.formats.akn, jsonld: enVigueur.formats.jsonld },
    original: enVigueur.original,
    ressource: "/v1/publications/" + encodeURIComponent(enVigueur.cle),
  }, { "content-location": "/v1/publications/" + encodeURIComponent(enVigueur.cle) });
}

// ------------------------------------------------------------------ base de données
// Collections du référentiel partagé (référentiel, trames, actes, comptes,
// métadonnées, journal d'audit, présence des postes). Le service de démonstration les conserve dans son état durable
// (partagé entre les postes quand la page est servie par la plateforme ; propre
// au navigateur dans l'édition statique — voir src/pages/host.js) : c'est
// l'implémentation « sans rien installer » du contrat de persistance. Un serveur
// externe MySQL / MariaDB expose exactement le même contrat — voir
// src/server/mysql/.
//
// La synchronisation est faite **enregistrement par enregistrement** : chaque
// écriture porte la révision que le client connaissait ; si le serveur en a une
// autre, il refuse et renvoie sa version (conflit), que le client affiche au
// lieu de l'écraser silencieusement.
const DBC = { config: 1, trames: 1, actes: 1, users: 1, meta: 1, journal: 1, presence: 1, informations: 1 };
const MAX_SYNC_RECORDS = 4000;

// Sensibilité des collections. `null` = lecture PUBLIQUE (documents de travail
// ouverts : le référentiel des trames et les métadonnées) ; sinon la clé
// minimale exigée. Les comptes (`users`) ne sortent que vers l'administration ;
// les actes, le journal et la présence ne sortent pas d'un poste identifié.
// C'est la traduction, côté service, du principe « le publié est public, le
// reste ne l'est pas ».
const DBC_LECTURE = {
  config: { min: "lecteur" },
  trames: null,
  actes: { min: "lecteur" },
  users: { min: "administrateur" },
  meta: null,
  journal: { min: "lecteur" },
  presence: { min: "lecteur" },
  // Les billets du recueil public se lisent par leur propre route (`/v1/informations`,
  // qui ne rend que les billets publiés) ; la lecture directe de la collection
  // donne aussi les brouillons, et demande donc une clé.
  informations: { min: "lecteur" },
};
// Ce que chaque écriture exige. Les comptes et la configuration ne se
// réécrivent que par un administrateur : un jeton de rédaction ne peut donc pas
// s'octroyer de rôle (c'était la faille d'élévation de privilèges).
const DBC_ECRITURE = {
  config: { min: "administrateur" },
  trames: { min: "editeur" },
  actes: { min: "redacteur" },
  users: { min: "administrateur" },
  meta: { min: "editeur" },
  journal: { min: "redacteur" },
  presence: { min: "redacteur" },
  informations: { min: "editeur" },
};

function collection(name) {
  db.collections = db.collections || {};
  let c = db.collections[name];
  if (!c) c = db.collections[name] = { rev: 0, records: {} };
  if (!c.records) c.records = {};
  return c;
}

function resumeCollection(c) {
  return Object.keys(c.records).map((id) => ({ id, rev: c.records[id].rev || 0, ord: c.records[id].ord || 0, payload: c.records[id].payload }));
}

function hDbHealth() {
  const collections = {};
  for (const name of Object.keys(DBC)) {
    const c = (db.collections && db.collections[name]) || { rev: 0, records: {} };
    collections[name] = { records: Object.keys(c.records || {}).length, revision: c.rev || 0 };
  }
  return ok(200, {
    statut: "ok",
    service: "Base de données du référentiel partagé",
    version: SERVICE_VERSION,
    driver: "démonstration (état durable)",
    partagee: true,
    message: "Service de démonstration : son état durable tient lieu de base de données partagée.",
    collections,
  });
}

function hDbCollection(name, headers) {
  if (!DBC[name]) return err(404, "Collection inconnue : " + name, { code: "collection_inconnue" });
  const regle = DBC_LECTURE[name];
  if (regle) {
    const bad = authFail(headers, regle);
    if (bad) return bad;
  }
  const c = collection(name);
  return ok(200, { collection: name, revision: c.rev || 0, records: resumeCollection(c) });
}

function hDbSync(name, b, headers) {
  if (!DBC[name]) return err(404, "Collection inconnue : " + name, { code: "collection_inconnue" });
  const bad = authFail(headers, DBC_ECRITURE[name]);
  if (bad) return bad;
  const upserts = Array.isArray(b.upserts) ? b.upserts : [];
  const deletes = Array.isArray(b.deletes) ? b.deletes : [];
  // `force` écrase sans contrôle de révision : c'est un geste de REPRISE de
  // données, réservé à l'ADMINISTRATION et JOURNALISÉ. Un rôle d'écriture
  // ordinaire ne peut donc pas écraser en silence l'écriture d'un autre poste —
  // il reçoit le conflit, et le résout. Voir NC-II-004 (résidu) et P-17.
  if (b.force) {
    const id = identiteDe(headers);
    if (!id || id.role !== "administrateur") {
      return err(403, "L'écrasement sans contrôle de révision (`force`) est réservé au rôle administrateur.", { code: "force_reserve_admin", role: id ? id.role : null });
    }
    journaliser("sync_force", "Écrasement sans contrôle de révision sur « " + name + " » (clé « " + (id.label || id.id) + " » : " + upserts.length + " écriture(s), " + deletes.length + " suppression(s)).");
  }
  if (upserts.length + deletes.length > MAX_SYNC_RECORDS) {
    return err(413, "Trop d'enregistrements dans une même synchronisation (maximum " + MAX_SYNC_RECORDS + ").", { code: "trop_d_enregistrements" });
  }
  const c = collection(name);
  const avant = { records: { ...c.records }, rev: c.rev || 0 };
  const applied = [];
  const conflicts = [];

  for (const u of upserts) {
    if (!u || u.id === undefined || u.id === null) continue;
    const id = String(u.id);
    const cur = c.records[id];
    if (!b.force) {
      if (cur && (cur.rev || 0) !== (u.rev || 0)) { conflicts.push({ id, rev: cur.rev || 0, ord: cur.ord || 0, payload: cur.payload }); continue; }
      if (!cur && u.rev) { conflicts.push({ id, deleted: true, rev: 0 }); continue; }
    }
    c.rev = (c.rev || 0) + 1;
    c.records[id] = { rev: c.rev, ord: Number(u.ord) || 0, payload: u.payload === undefined ? null : u.payload, at: nowIso() };
    applied.push({ id, rev: c.rev });
  }

  for (const d of deletes) {
    if (!d || d.id === undefined || d.id === null) continue;
    const id = String(d.id);
    const cur = c.records[id];
    if (!cur) continue;
    if (!b.force && (cur.rev || 0) !== (d.rev || 0)) { conflicts.push({ id, rev: cur.rev || 0, ord: cur.ord || 0, payload: cur.payload }); continue; }
    delete c.records[id];
    c.rev = (c.rev || 0) + 1;
    applied.push({ id, rev: 0, deleted: true });
  }

  if (!saveDb(db)) {
    c.records = avant.records;
    c.rev = avant.rev;
    return err(507, "Le service n'a plus de place disponible.");
  }
  return ok(200, { collection: name, revision: c.rev || 0, applied, conflicts });
}

// ============================================================================
// LE BULLETIN DES ACTES (1.6.0) — le miroir de démonstration
//
// Le vrai moteur vit dans `src/server/mysql/bulletins.mjs` : c'est lui qui fait
// foi, et c'est lui qui tourne sur l'installation auto-hébergée. Ici, on en
// reproduit le COMPORTEMENT et les RÉPONSES, pour que l'écran « Bulletin », les
// sous-pages publiques et le flux aient quelque chose de vrai à montrer dans
// l'aperçu de la plateforme — qui, elle, n'a pas de serveur.
//
// Ce miroir est RÉDUIT, et chaque réduction a une raison :
//   • SYNCHRONE. Le service de démonstration répond par `self.rpc.api` en une
//     seule fois : pas de promesses, pas d'attente. Le moteur, lui, est
//     asynchrone (il lit un état, envoie des courriels).
//   • SANS COURRIEL. La plateforme n'a pas de serveur SMTP (voir `/v1/courriel`) :
//     `bEnvoyerCourriel` constate l'échec au lieu de l'ignorer, exactement comme
//     le moteur quand aucun port de courriel ne lui est branché. L'abonnement
//     par courriel est donc FERMÉ ici, et le tableau de bord le dit.
//   • SANS ADRESSE PUBLIQUE. Le service ne connaît pas l'adresse de la page
//     (`SCRIBA_PUBLIQUE_URL` est vide) : les liens de confirmation et de
//     désabonnement restent des chemins, comme sur un service auto-hébergé qui
//     n'aurait pas renseigné cette variable.
//   • SANS MISE EN PAGE. Le texte, le Markdown, le flux et les pages du recueil
//     ne sont PAS produits ici : c'est la page qui les compose, faute de serveur
//     pour les servir (voir src/lib/bulletins-formats.js). Le service rend les
//     DONNÉES — c'est son rôle sur tous les déploiements.
//
// Les fonctions de date et de cadence sont recopiées du moteur (même découpe,
// mêmes libellés, même arithmétique UTC) : c'est le seul moyen d'obtenir des
// périodes identiques sans pouvoir importer son paquet.
// ============================================================================
const B_MOIS_FR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const B_CADENCES = [
  { id: "quotidienne", label: "Quotidienne", unite: "jour", pas: 1, resume: "un bulletin par jour" },
  { id: "hebdomadaire", label: "Hebdomadaire", unite: "semaine", pas: 1, resume: "un bulletin par semaine (du lundi au dimanche)" },
  { id: "bimensuelle", label: "Bimensuelle (deux par mois)", unite: "demi-mois", pas: 1, resume: "deux bulletins par mois (du 1er au 15, puis du 16 au dernier jour)" },
  { id: "mensuelle", label: "Mensuelle", unite: "mois", pas: 1, resume: "un bulletin par mois" },
  { id: "bimestrielle", label: "Bimestrielle (tous les deux mois)", unite: "mois", pas: 2, resume: "un bulletin tous les deux mois" },
  { id: "trimestrielle", label: "Trimestrielle", unite: "trimestre", pas: 1, resume: "un bulletin par trimestre" },
  { id: "semestrielle", label: "Semestrielle", unite: "mois", pas: 6, resume: "un bulletin tous les six mois" },
  { id: "annuelle", label: "Annuelle", unite: "an", pas: 1, resume: "un bulletin par an" },
  { id: "personnalisee", label: "Personnalisée", unite: "", pas: 0, resume: "toutes les N unités (jours, semaines, demi-mois, mois, trimestres, années)" },
];
const B_UNITES = [
  { id: "jour", label: "jours", singulier: "jour" },
  { id: "semaine", label: "semaines", singulier: "semaine" },
  { id: "demi-mois", label: "demi-mois", singulier: "demi-mois" },
  { id: "mois", label: "mois", singulier: "mois" },
  { id: "trimestre", label: "trimestres", singulier: "trimestre" },
  { id: "an", label: "années", singulier: "année" },
];
const B_MOTIF_SMTP = "Ce service de démonstration n'a pas accès à un serveur SMTP : l'envoi par courriel n'est actif qu'avec le service auto-hébergé (voir src/server/mysql/env.example, SMTP_HOST).";

const bCadenceParId = (id) => B_CADENCES.find((c) => c.id === String(id || "").trim().toLowerCase()) || null;

function bPasAccepte(unite, pas) {
  if (!B_UNITES.some((u) => u.id === unite)) return 0;
  const n = Number(pas);
  if (unite === "demi-mois") return n === 1 ? 1 : 0;
  return Number.isInteger(n) && n >= 1 && n <= 60 ? n : 0;
}

// La cadence NORMALISÉE : celle que le moteur emploie, et que le client reçoit.
// Une cadence illisible rend `null` — le service retombe alors sur « mensuelle ».
function bNormaliserCadence(v) {
  if (!v) return null;
  const brut = typeof v === "string" ? { id: v } : v;
  const nommee = bCadenceParId(brut.id || brut.cadence || brut.mode);
  const personnalisee = !nommee || nommee.id === "personnalisee";
  const unite = personnalisee ? String(brut.unite || "").trim().toLowerCase() : nommee.unite;
  const pas = bPasAccepte(unite, personnalisee ? (brut.pas === undefined || brut.pas === "" ? 1 : brut.pas) : nommee.pas);
  if (!pas) return null;
  const id = nommee ? nommee.id : "personnalisee";
  const ancre = /^\d{4}-\d{2}-\d{2}$/.test(String(brut.ancre || "")) ? String(brut.ancre) : "";
  const c = { id, unite, pas, ancre };
  return { ...c, label: (nommee || {}).label || "Personnalisée", resume: bLibelleCadence(c) };
}

function bLibelleCadence(c) {
  if (!c) return "";
  const nommee = bCadenceParId(c.id);
  if (nommee && nommee.id !== "personnalisee") return nommee.resume;
  const u = B_UNITES.find((x) => x.id === c.unite) || { label: c.unite, singulier: c.unite };
  return c.pas === 1 ? "un bulletin par " + u.singulier : "un bulletin tous les " + c.pas + " " + u.label;
}

// ------------------------------------------------------------------ les dates
// Tout est calculé sur des dates ISO et en UTC : un bulletin ne doit pas changer
// de période selon le fuseau du poste qui le compose.
const bD = (iso) => {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
  return m ? { y: Number(m[1]), m: Number(m[2]), d: Number(m[3]) } : null;
};
const bPad = (n) => String(n).padStart(2, "0");
const bEnIso = (x) => x.y + "-" + bPad(x.m) + "-" + bPad(x.d);
const bJourDe = (iso) => { const x = bD(iso); return x ? bEnIso(x) : ""; };
const bJoursDansMois = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const bMsJour = 86400000;
const bMs = (iso) => { const x = bD(iso); return Date.UTC(x.y, x.m - 1, x.d); };
const bComparer = (a, b) => (String(a || "") < String(b || "") ? -1 : String(a || "") > String(b || "") ? 1 : 0);

function bAjouterJours(iso, n) {
  const x = bD(iso);
  if (!x) return "";
  const t = new Date(bMs(bEnIso(x)) + n * bMsJour);
  return bEnIso({ y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() });
}

function bAjouterMois(iso, n) {
  const x = bD(iso);
  if (!x) return "";
  const total = x.y * 12 + (x.m - 1) + n;
  const y = Math.floor(total / 12);
  const m = (total % 12) + 1;
  return bEnIso({ y, m, d: Math.min(x.d, bJoursDansMois(y, m)) });
}

const bPremierDuMois = (iso) => { const x = bD(iso); return bEnIso({ y: x.y, m: x.m, d: 1 }); };

// Le premier jour de l'UNITÉ qui contient la date.
function bDebutUnite(iso, unite) {
  const x = bD(iso);
  if (!x) return "";
  if (unite === "jour") return bEnIso(x);
  if (unite === "semaine") {
    const t = new Date(bMs(bEnIso(x)));
    return bAjouterJours(bEnIso(x), -((t.getUTCDay() + 6) % 7));
  }
  if (unite === "demi-mois") return bEnIso({ y: x.y, m: x.m, d: x.d <= 15 ? 1 : 16 });
  if (unite === "mois") return bEnIso({ y: x.y, m: x.m, d: 1 });
  if (unite === "trimestre") return bEnIso({ y: x.y, m: 3 * Math.floor((x.m - 1) / 3) + 1, d: 1 });
  if (unite === "an") return bEnIso({ y: x.y, m: 1, d: 1 });
  return "";
}

const bMoitie = (iso) => (bD(iso).d <= 15 ? 0 : 1);

// La distance, en unités, entre deux DÉBUTS d'unité (le second moins le premier).
function bDistanceUnites(unite, a, b) {
  const x = bD(a), y = bD(b);
  if (!x || !y) return 0;
  const mois = (y.y - x.y) * 12 + (y.m - x.m);
  if (unite === "jour") return Math.round((bMs(bEnIso(y)) - bMs(bEnIso(x))) / bMsJour);
  if (unite === "semaine") return Math.round((bMs(bEnIso(y)) - bMs(bEnIso(x))) / (7 * bMsJour));
  if (unite === "demi-mois") return mois * 2 + (bMoitie(bEnIso(y)) - bMoitie(bEnIso(x)));
  if (unite === "mois") return mois;
  if (unite === "trimestre") return Math.round(mois / 3);
  if (unite === "an") return y.y - x.y;
  return 0;
}

function bDemiMoisVoisin(debut, sens) {
  const x = bD(debut);
  if (sens > 0) return x.d <= 15 ? bEnIso({ y: x.y, m: x.m, d: 16 }) : bPremierDuMois(bAjouterMois(debut, 1));
  return x.d > 15 ? bEnIso({ y: x.y, m: x.m, d: 1 }) : bEnIso({ ...bD(bAjouterMois(debut, -1)), d: 16 });
}

function bDecaler(debut, unite, n) {
  if (!n) return debut;
  if (unite === "jour") return bAjouterJours(debut, n);
  if (unite === "semaine") return bAjouterJours(debut, 7 * n);
  if (unite === "mois") return bAjouterMois(debut, n);
  if (unite === "trimestre") return bAjouterMois(debut, 3 * n);
  if (unite === "an") return bAjouterMois(debut, 12 * n);
  if (unite === "demi-mois") {
    let courant = debut;
    for (let i = 0; i < Math.abs(n); i++) courant = bDemiMoisVoisin(courant, n > 0 ? 1 : -1);
    return courant;
  }
  return debut;
}

// LA PÉRIODE qui contient une date, ancrée sur `ancre` (sans elle, « tous les
// deux mois » commencerait au mois du jour où l'on regarde). Bornes INCLUSES.
function bPeriodeDe(iso, cadence) {
  const c = bNormaliserCadence(cadence);
  const jour = bJourDe(iso);
  if (!c || !jour) return null;
  const ancre = bDebutUnite(c.ancre || jour, c.unite);
  const debut = bDebutUnite(jour, c.unite);
  const n = bDistanceUnites(c.unite, ancre, debut);
  const reste = ((n % c.pas) + c.pas) % c.pas;
  const d = reste ? bDecaler(debut, c.unite, -reste) : debut;
  return { debut: d, fin: bAjouterJours(bDecaler(d, c.unite, c.pas), -1) };
}

function bPeriodeSuivante(periode, cadence) {
  const c = bNormaliserCadence(cadence);
  const debut = bDecaler(periode.debut, c.unite, c.pas);
  return { debut, fin: bAjouterJours(bDecaler(debut, c.unite, c.pas), -1) };
}

const bDateLongue = (iso) => { const x = bD(iso); return x ? x.d + " " + B_MOIS_FR[x.m - 1] + " " + x.y : ""; };

function bDateCourte(iso, annee) {
  const x = bD(iso);
  if (!x) return "";
  return (x.d === 1 ? "1er" : String(x.d)) + " " + B_MOIS_FR[x.m - 1] + (annee === false ? "" : " " + x.y);
}

function bIntervalleTexte(debut, fin) {
  const a = bD(debut), b = bD(fin);
  if (!a || !b) return "";
  if (debut === fin) return "du " + bDateCourte(debut);
  const memeMois = a.y === b.y && a.m === b.m;
  const premier = memeMois ? (a.d === 1 ? "1er" : String(a.d)) : bDateCourte(debut, a.y === b.y);
  return "du " + premier + " au " + bDateCourte(fin);
}

// Le libellé COURT d'une période — celui qui tient dans un titre de bulletin.
function bLibellePeriode(periode, cadence) {
  const c = bNormaliserCadence(cadence);
  const a = bD(periode.debut), b = bD(periode.fin);
  if (!c || !a || !b) return bIntervalleTexte(periode.debut, periode.fin);
  if (c.unite === "an") return periode.debut.slice(0, 4);
  if (c.unite === "mois") {
    if (c.pas === 1) return B_MOIS_FR[a.m - 1] + " " + a.y;
    if (a.y === b.y) return B_MOIS_FR[a.m - 1] + "–" + B_MOIS_FR[b.m - 1] + " " + a.y;
    return B_MOIS_FR[a.m - 1] + " " + a.y + " – " + B_MOIS_FR[b.m - 1] + " " + b.y;
  }
  if (c.unite === "trimestre") {
    if (c.pas === 1) {
      const q = Math.floor((a.m - 1) / 3) + 1;
      return (q === 1 ? "1er" : q + "e") + " trimestre " + a.y;
    }
    if (a.y === b.y) return B_MOIS_FR[a.m - 1] + "–" + B_MOIS_FR[b.m - 1] + " " + a.y;
    return B_MOIS_FR[a.m - 1] + " " + a.y + " – " + B_MOIS_FR[b.m - 1] + " " + b.y;
  }
  if (c.unite === "demi-mois") return (a.d > 15 ? "16–" + b.d : "1er–" + b.d) + " " + B_MOIS_FR[a.m - 1] + " " + a.y;
  if (c.unite === "semaine") return "semaine " + bIntervalleTexte(periode.debut, periode.fin);
  return bIntervalleTexte(periode.debut, periode.fin);
}

const bDateParution = (periode, r) => bAjouterJours(periode.fin, Math.max(0, Number(r.parutionJours) || 0) + 1);

const bCourielValide = (v) => {
  const s = String(v || "").trim();
  return s.length >= 6 && s.length <= 190 && /^[^\s@,;<>\"]+@[^\s@,;<>\"]+\.[^\s@,;<>\"]{2,}$/.test(s) ? s : "";
};

// --------------------------------------------------------------- l'état
function bEtatVide() {
  return { v: 1, secret: "", depuis: "", cadence: "", periodes: {}, abonnes: {}, file: [], envois: [] };
}

function bEtat() {
  if (!db.bulletins || typeof db.bulletins !== "object") db.bulletins = bEtatVide();
  const b = db.bulletins;
  if (!b.periodes) b.periodes = {};
  if (!b.abonnes) b.abonnes = {};
  if (!b.file) b.file = [];
  if (!b.envois) b.envois = [];
  return b;
}

// Le secret des jetons : tiré UNE FOIS puis conservé, sinon les liens de
// confirmation déjà partis ne vaudraient plus rien.
function bSecret() {
  const b = bEtat();
  if (!b.secret) { b.secret = sha256Hex("scribae|abonnement|" + String(Math.random()).slice(2) + "|" + nowIso()); journaliser("bulletin", "secret d'abonnement créé"); }
  return b.secret;
}

const bJeton = (genre, abonne) => sha256Hex("scribae|" + genre + "|" + bSecret() + "|" + abonne).slice(0, 40);
const bLienConfirmation = (a, r) => ((r && r.base) || "") + "/recueil/bulletins/confirmation?jeton=" + encodeURIComponent(bJeton("conf", a.id));
const bLienDesabonnement = (a, r) => ((r && r.base) || "") + "/recueil/bulletins/desabonnement?jeton=" + encodeURIComponent(bJeton("desabo", a.id));

// --------------------------------------------------------------- réglages
// Les réglages EFFECTIFS, lus là où l'administration les a écrits
// (`config.publication.bulletin`, Administration › Publication).
function bReglages() {
  const rec = db.collections && db.collections.config && db.collections.config.records
    && db.collections.config.records.self;
  const doc = rec && rec.payload;
  const b = (doc && doc.publication && doc.publication.bulletin) || {};
  const jours = Number(b.parutionJours);
  return {
    actif: b.actif === true,
    titre: String(b.titre || "").trim() || "Bulletin des actes administratifs",
    titreBulletin: String(b.titreBulletin || "").trim(),
    sousTitre: String(b.sousTitre || "").trim(),
    cadence: bNormaliserCadence(b.cadence) || bNormaliserCadence("mensuelle"),
    parutionJours: Number.isInteger(jours) ? Math.max(0, Math.min(31, jours)) : 1,
    entete: String(b.entete || "").trim(),
    pied: String(b.pied || "").trim(),
    expediteurNom: String(b.expediteurNom || "").trim(),
    repondreA: String(b.repondreA || "").trim(),
    // Pas d'adresse publique : le service de démonstration ne connaît pas
    // l'adresse de la page (voir SCRIBA_PUBLIQUE_URL sur l'installation).
    base: "",
  };
}

// ------------------------------------------------- les publications à rassembler
// La dernière version de chaque identifiant ELI, JAMAIS les publications
// réservées aux agents : un bulletin se lit en clair sur le recueil.
function bPublications() {
  const vue = [];
  for (const p of Object.keys(db.publies).map((k) => db.publies[k])) {
    if (!p || p.reserve === true) continue;
    if (dernierVisible(p.eliUri, false) !== p) continue;
    vue.push({
      cle: p.cle, eliUri: p.eliUri || "", numero: p.numero || "", objet: p.objet || "",
      nature: p.nature || "", themeId: p.themeId || "", themeLabel: p.themeLabel || "",
      entityName: p.entityName || "", dateDocument: p.dateDocument || "",
      datePublication: p.datePublication || "", dateOpposabilite: p.dateOpposabilite || "",
      kind: p.kind || "originale", juridique: p.juridique === false ? false : undefined,
      natureDoc: p.natureDoc || "", recueil: p.recueil || "",
    });
  }
  return vue;
}

// ------------------------------------------------------------ composition
function bComposer(periode, cadence, r, liste, annee, rang, provisoire) {
  const entites = new Map();
  let total = 0;
  for (const p of liste) {
    const nom = String(p.entityName || "").trim() || "(sans entité)";
    const theme = String(p.themeLabel || "").trim() || "Autres actes";
    if (!entites.has(nom)) entites.set(nom, new Map());
    const themes = entites.get(nom);
    if (!themes.has(theme)) themes.set(theme, []);
    themes.get(theme).push({
      cle: p.cle, eliUri: p.eliUri || "", numero: p.numero || "", objet: p.objet || "",
      nature: p.nature || "", themeId: p.themeId || "", themeLabel: p.themeLabel || "",
      entityName: nom, dateDocument: p.dateDocument || "", datePublication: p.datePublication || "",
      dateOpposabilite: p.dateOpposabilite || "", kind: p.kind || "originale",
      juridique: p.juridique === false ? false : undefined, natureDoc: p.natureDoc || undefined,
      remplacee: (p.remplacee || 0) > 0, recueil: p.recueil || "",
    });
    total += 1;
  }
  const ordreTexte = (a, b) => String(a).localeCompare(String(b), "fr", { sensitivity: "base" });
  const listeEntites = [...entites.entries()]
    .filter(([, themes]) => themes.size)
    .map(([nom, themes]) => ({
      nom,
      nombre: [...themes.values()].reduce((n, l) => n + l.length, 0),
      themes: [...themes.entries()]
        .map(([label, actes]) => ({
          id: actes[0].themeId || "",
          label,
          nombre: actes.length,
          actes: actes.sort((a, b) => bComparer(a.datePublication, b.datePublication) || ordreTexte(a.numero, b.numero) || ordreTexte(a.objet, b.objet)),
        }))
        .sort((a, b) => ordreTexte(a.label, b.label)),
    }))
    // Les actes sans entité ferment la marche : ce n'est pas une rubrique.
    .sort((a, b) => (a.nom === "(sans entité)" ? 1 : b.nom === "(sans entité)" ? -1 : ordreTexte(a.nom, b.nom)));

  const libelle = bLibellePeriode(periode, cadence);
  const bulletin = {
    id: periode.debut, debut: periode.debut, fin: periode.fin, annee, rang,
    cadence: cadence.id,
    titre: (r.titreBulletin || r.titre) + " n° " + rang + " — " + libelle,
    libelle, sousTitre: r.sousTitre, entete: r.entete, pied: r.pied,
    nombre: total, entites: listeEntites, provisoire: !!provisoire,
    composeLe: nowIso(), empreinte: "",
  };
  bulletin.empreinte = sha256Hex(JSON.stringify([bulletin.id, bulletin.titre, bulletin.nombre, bulletin.entites]));
  return bulletin;
}

// Les publications d'une période : la dernière version de chaque ELI.
function bPublicationsDe(periode, liste) {
  const dedans = (liste || []).filter((p) => {
    const d = String(p.datePublication || "").slice(0, 10);
    return d >= periode.debut && d <= periode.fin;
  });
  const dernieres = new Map();
  for (const p of dedans) {
    const k = String(p.eliUri || p.cle);
    const deja = dernieres.get(k);
    if (!deja) { dernieres.set(k, { ...p, remplacee: 0 }); continue; }
    if (bComparer(String(p.datePublication || ""), String(deja.datePublication || "")) >= 0) {
      dernieres.set(k, { ...p, remplacee: (deja.remplacee || 0) + 1 });
    } else {
      deja.remplacee += 1;
    }
  }
  return [...dernieres.values()];
}

// Le rang d'un numéro : continu dans l'année, comme un journal officiel.
function bRangPour(annee, debut) {
  let rang = 0;
  for (const k of Object.keys(bEtat().periodes)) {
    const x = bEtat().periodes[k];
    if (x && x.bulletin && x.bulletin.annee === annee && bComparer(x.bulletin.debut, debut) < 0) rang += 1;
  }
  return rang + 1;
}

// Compose (ou recompose) une période. Ne touche pas aux envois.
function bComposerPeriode(periode, r, options) {
  const b = bEtat();
  const provisoire = !!(options && options.provisoire);
  const liste = (options && options.publications) || [];
  const annee = Number(periode.fin.slice(0, 4));
  const existante = b.periodes[periode.debut];
  const rang = (existante && existante.bulletin && existante.bulletin.rang) || bRangPour(annee, periode.debut);
  const dedans = bPublicationsDe(periode, liste);
  if (!dedans.length) {
    // RÈGLE : pas de publication, pas de bulletin. La période est marquée, pour
    // ne pas être réexaminée à chaque passe.
    if (provisoire && existante && existante.bulletin) { delete b.periodes[periode.debut]; return null; }
    b.periodes[periode.debut] = { etat: "vide", examineLe: nowIso() };
    return null;
  }
  const bulletin = bComposer(periode, r.cadence, r, dedans, annee, rang, provisoire);
  b.periodes[periode.debut] = {
    etat: provisoire ? "provisoire" : "publie",
    composeLe: (existante && existante.bulletin && existante.bulletin.composeLe) || bulletin.composeLe,
    majLe: nowIso(),
    publieLe: provisoire ? null : ((existante && existante.publieLe) || nowIso()),
    envoi: (existante && existante.envoi) || null,
    bulletin,
  };
  return bulletin;
}

// La mémoire du service ne grandit pas sans fin.
function bElaguer() {
  const b = bEtat();
  let retires = 0;
  const avecBulletin = Object.keys(b.periodes).filter((k) => b.periodes[k] && b.periodes[k].bulletin);
  if (avecBulletin.length > 60) {
    for (const k of avecBulletin.sort((x, y) => bComparer(y, x)).slice(60)) { delete b.periodes[k]; retires += 1; }
  }
  const vides = Object.keys(b.periodes).filter((k) => b.periodes[k] && !b.periodes[k].bulletin);
  if (vides.length > 240) {
    for (const k of vides.sort((x, y) => bComparer(y, x)).slice(240)) { delete b.periodes[k]; retires += 1; }
  }
  return retires;
}

// ------------------------------------------------------------ les envois
// Le port du courriel : il CONSTATE l'absence de serveur, il ne l'ignore pas.
// Chaque tentative est tracée dans le journal du service, comme sur le vrai
// service (qui, lui, écrit dans `sb_courriel`).
function bEnvoyerCourriel(o) {
  journaliser("bulletin_courriel", (o.evenement || "courriel") + " → " + (o.destinataires || []).map((d) => d.courriel).join(", ") + " : non envoyé (" + o.sujet + ")");
  return { envoye: false, motif: B_MOTIF_SMTP };
}

function bProgrammerInterne(bulletin) {
  const b = bEtat();
  const fiches = Object.keys(b.abonnes).map((k) => b.abonnes[k]).filter((a) => a && a.etat === "confirme");
  const deja = new Set(b.file.map((x) => x.abonne + "|" + x.bulletin));
  for (const a of fiches) if (!deja.has(a.id + "|" + bulletin.id)) b.file.push({ bulletin: bulletin.id, abonne: a.id, essais: 0, dernier: "", motif: "" });
  const p = b.periodes[bulletin.id];
  if (p) p.envoi = { total: fiches.length, fait: 0, echecs: 0, depuis: nowIso(), termineLe: fiches.length ? null : nowIso() };
  return fiches.length;
}

function bViderFile() {
  const b = bEtat();
  const passe = { total: 0, ok: 0, echecs: 0 };
  if (!b.file.length) return passe;
  let restants = b.file.length;
  while (restants > 0 && passe.total < 40 && b.file.length) {
    const item = b.file.shift();
    restants -= 1;
    const periode = b.periodes[item.bulletin];
    const bulletin = periode && periode.bulletin;
    const abonne = b.abonnes[item.abonne];
    if (!bulletin || !abonne || abonne.etat !== "confirme") continue;
    const envoi = bEnvoyerCourriel({ destinataires: [{ courriel: abonne.courriel, nom: abonne.nom }], sujet: bulletin.titre, evenement: "bulletin", cible: bulletin.id });
    passe.total += 1;
    if (envoi.envoye) {
      passe.ok += 1;
      if (periode.envoi) periode.envoi.fait = (periode.envoi.fait || 0) + 1;
    } else {
      item.essais = (item.essais || 0) + 1;
      item.dernier = nowIso();
      item.motif = String(envoi.motif || "").slice(0, 200);
      // Trois tentatives, puis la livraison est ABANDONNÉE avec son motif.
      if (item.essais >= 3) {
        passe.echecs += 1;
        if (periode.envoi) periode.envoi.echecs = (periode.envoi.echecs || 0) + 1;
      } else {
        b.file.push(item);
      }
    }
    if (periode && periode.envoi) periode.envoi.termineLe = b.file.some((x) => x.bulletin === bulletin.id) ? null : nowIso();
  }
  if (passe.total) {
    b.envois.push({ le: nowIso(), total: passe.total, ok: passe.ok, echecs: passe.echecs });
    if (b.envois.length > 40) b.envois.splice(0, b.envois.length - 40);
  }
  return passe;
}

// ----------------------------------------------- la passe automatique
// Elle clôt les périodes ÉCHUES, compose celles qui ne sont plus vides, puis
// vide la file d'envoi. C'est le seul endroit qui écrit et qui envoie.
function bAssurer() {
  const r = bReglages();
  const b = bEtat();
  const passe = { actif: r.actif, composees: [], publies: [], vides: [], envois: { total: 0, ok: 0, echecs: 0 }, motif: "" };
  if (!r.actif) { passe.motif = "Le bulletin est éteint."; return passe; }
  if (b.cadence !== r.cadence.id) b.cadence = r.cadence.id;
  const liste = bPublications();
  const auj = today();
  // LA MISE EN SERVICE : à la première passe, on remonte à la plus ancienne
  // publication détenue — mais pas au-delà de 60 périodes, pour qu'un recueil de
  // dix ans ne fasse pas paraître cent bulletins d'un coup.
  if (!b.depuis) {
    const enCours = bPeriodeDe(auj, r.cadence);
    const plusAncienne = liste.map((p) => String(p.datePublication || "").slice(0, 10)).filter(Boolean).sort()[0] || "";
    if (plusAncienne && enCours) {
      const debutPublication = (bPeriodeDe(plusAncienne, r.cadence) || {}).debut || "";
      const borne = bDecaler(enCours.debut, r.cadence.unite, -60 * r.cadence.pas);
      b.depuis = debutPublication && bComparer(debutPublication, borne) > 0 ? debutPublication : borne;
    } else {
      b.depuis = enCours ? enCours.debut : auj;
    }
    journaliser("bulletin", "mise en service du bulletin à la période du " + b.depuis);
  }
  let periode = bPeriodeDe(b.depuis, r.cadence);
  let parcourues = 0;
  while (periode && periode.fin < auj && parcourues < 60) {
    parcourues += 1;
    const connue = b.periodes[periode.debut];
    if (!connue || connue.etat === "provisoire") {
      const bulletin = bComposerPeriode(periode, r, { publications: liste, provisoire: false });
      if (bulletin) {
        passe.composees.push(bulletin.id);
        passe.publies.push(bulletin.id);
        bProgrammerInterne(bulletin);
      } else if (!connue) {
        passe.vides.push(periode.debut);
      }
    }
    const suivante = bPeriodeSuivante(periode, r.cadence);
    if (!suivante || bComparer(suivante.debut, periode.debut) <= 0) break;
    periode = suivante;
  }
  passe.envois = bViderFile();
  const elagues = bElaguer();
  if (passe.composees.length || passe.vides.length || passe.envois.total || elagues) saveDb(db);
  if (passe.composees.length) journaliser("bulletin", "bulletins composés : " + passe.composees.join(", "));
  return passe;
}

// ------------------------------------------------------------ les abonnés
function bResumeAbonne(a) {
  return {
    id: a.id, courriel: a.courriel, nom: a.nom || "", etat: a.etat,
    creeLe: a.creeLe || "", confirmeLe: a.confirmeLe || "", desaboLe: a.desaboLe || "", source: a.source || "",
  };
}

// L'INSCRIPTION ne dit JAMAIS si l'adresse était déjà là : la réponse est la
// même dans les deux cas, sinon elle servirait à savoir qui est abonné.
function bAbonner(o) {
  const r = bReglages();
  const courriel = bCourielValide(o && o.courriel);
  if (!courriel) return { ok: false, status: 422, motif: "Cette adresse électronique n'est pas valide." };
  if (!r.actif) return { ok: false, status: 409, motif: "Le bulletin n'est pas ouvert sur ce recueil." };
  const b = bEtat();
  const id = "ab-" + sha256Hex(courriel.toLowerCase()).slice(0, 16);
  const existante = b.abonnes[id];
  const actifs = Object.keys(b.abonnes).filter((k) => b.abonnes[k].etat !== "retire").length;
  if (!existante && actifs >= 2000) return { ok: false, status: 507, motif: "Le nombre maximal d'abonnés est atteint sur ce service." };
  const fiche = existante || { id, courriel, nom: String((o && o.nom) || "").slice(0, 120), etat: "attente", creeLe: nowIso(), source: "recueil" };
  if (o && o.nom) fiche.nom = String(o.nom).slice(0, 120);
  if (fiche.etat !== "confirme") fiche.etat = "attente";
  b.abonnes[id] = fiche;
  const envoi = bEnvoyerCourriel({
    destinataires: [{ courriel: fiche.courriel, nom: fiche.nom }],
    sujet: "Confirmez votre abonnement — " + r.titre,
    evenement: "bulletin_abonnement", cible: fiche.id,
  });
  saveDb(db);
  return {
    ok: true, status: 202, abonne: bResumeAbonne(fiche), envoye: !!envoi.envoye, motif: envoi.envoye ? "" : (envoi.motif || ""),
    message: envoi.envoye
      ? "Un courriel de confirmation vient d'être envoyé à " + fiche.courriel + ". L'abonnement prend effet dès que le lien qu'il contient est ouvert."
      : "Votre demande est enregistrée, mais le courriel de confirmation n'a pas pu être envoyé (" + envoi.motif + ") : l'abonnement n'est pas encore actif.",
  };
}

// La confirmation (le lien du courriel). Un jeton inconnu ne dit rien de plus
// qu'« invalide » : il ne révèle pas l'existence d'une fiche.
function bConfirmer(jetonRecu) {
  const b = bEtat();
  const j = String(jetonRecu || "").trim();
  if (!j) return { ok: false, status: 400, motif: "Jeton de confirmation absent." };
  const r = bReglages();
  for (const id of Object.keys(b.abonnes)) {
    const a = b.abonnes[id];
    if (!a || bJeton("conf", id) !== j) continue;
    if (a.etat !== "confirme") { a.etat = "confirme"; a.confirmeLe = nowIso(); saveDb(db); }
    return { ok: true, status: 200, abonne: bResumeAbonne(a), desabonnement: r.base ? bLienDesabonnement(a, r) : "" };
  }
  return { ok: false, status: 404, motif: "Ce lien de confirmation n'est plus valable." };
}

function bDesabonner(jetonRecu) {
  const b = bEtat();
  const j = String(jetonRecu || "").trim();
  if (!j) return { ok: false, status: 400, motif: "Jeton de désabonnement absent." };
  for (const id of Object.keys(b.abonnes)) {
    const a = b.abonnes[id];
    if (!a || bJeton("desabo", id) !== j) continue;
    a.etat = "retire";
    a.desaboLe = nowIso();
    // Un désabonnement qui laisserait un courriel en file serait un mensonge.
    b.file = b.file.filter((x) => x.abonne !== id);
    saveDb(db);
    return { ok: true, status: 200, abonne: bResumeAbonne(a) };
  }
  return { ok: false, status: 404, motif: "Ce lien de désabonnement n'est plus valable." };
}

function bRetirerAbonne(id) {
  const b = bEtat();
  const fiche = b.abonnes[id];
  if (!fiche) return { ok: false, status: 404, motif: "Abonné inconnu : " + id };
  fiche.etat = "retire";
  fiche.desaboLe = nowIso();
  b.file = b.file.filter((x) => x.abonne !== fiche.id);
  saveDb(db);
  return { ok: true, status: 200, abonne: bResumeAbonne(fiche) };
}

// ------------------------------------------------------------- les lectures
function bListe() {
  return Object.keys(bEtat().periodes)
    .map((k) => bEtat().periodes[k])
    .filter((p) => p && p.bulletin)
    .map((p) => p.bulletin)
    .sort((a, c) => bComparer(c.debut, a.debut));
}

const bLire = (id) => {
  const p = bEtat().periodes[String(id || "")];
  return p && p.bulletin ? p.bulletin : null;
};

function bResume(bulletin) {
  const p = bEtat().periodes[bulletin.id] || {};
  return {
    id: bulletin.id, titre: bulletin.titre, libelle: bulletin.libelle,
    debut: bulletin.debut, fin: bulletin.fin, annee: bulletin.annee, rang: bulletin.rang,
    nombre: bulletin.nombre, provisoire: bulletin.provisoire === true,
    composeLe: bulletin.composeLe, publieLe: p.publieLe || null,
    empreinte: bulletin.empreinte, envoi: p.envoi || null,
    entites: (bulletin.entites || []).map((e) => ({ nom: e.nom, nombre: e.nombre })),
  };
}

// Ce que le recueil public affiche. `actif: false` dit au client de n'en rien
// montrer. C'est la réponse de `publicEtat()` du moteur, à une réserve près :
// l'abonnement est FERMÉ, faute de serveur de courriel (voir l'en-tête).
function bPublicEtat() {
  const r = bReglages();
  if (!r.actif) return { actif: false };
  const b = bEtat();
  const auj = today();
  const enCours = bPeriodeDe(auj, r.cadence);
  const suivante = enCours && enCours.fin >= auj ? enCours : (enCours ? bPeriodeSuivante(enCours, r.cadence) : null);
  return {
    actif: true, titre: r.titre, sousTitre: r.sousTitre,
    cadence: { id: r.cadence.id, label: r.cadence.label, resume: r.cadence.resume },
    abonnement: false,
    motifAbonnement: "Ce service de démonstration n'a pas accès à un serveur SMTP, et son adresse publique n'est pas réglée : l'abonnement par courriel n'est ouvert qu'avec le service auto-hébergé (voir src/server/mysql/env.example, SMTP_HOST et SCRIBA_PUBLIQUE_URL).",
    prochaine: suivante ? { debut: suivante.debut, fin: suivante.fin, libelle: bLibellePeriode(suivante, r.cadence), parution: bDateParution(suivante, r) } : null,
    bulletins: bListe().map(bResume),
    depuis: b.depuis || "",
  };
}

// L'état vu par l'administration : les réglages effectifs, ce qui reste à
// envoyer, les abonnés, les dernières passes. La période EN COURS y est rendue
// en ENTIER quand elle a été composée à titre provisoire.
function bTableauDeBord() {
  const r = bReglages();
  const b = bEtat();
  const auj = today();
  const enCours = bPeriodeDe(auj, r.cadence);
  const suivante = enCours && enCours.fin >= auj ? enCours : (enCours ? bPeriodeSuivante(enCours, r.cadence) : null);
  return {
    actif: r.actif, titre: r.titre, titreBulletin: r.titreBulletin, sousTitre: r.sousTitre,
    cadence: { id: r.cadence.id, label: r.cadence.label, unite: r.cadence.unite, pas: r.cadence.pas, ancre: r.cadence.ancre, resume: r.cadence.resume },
    cadences: B_CADENCES.map((c) => ({ id: c.id, label: c.label, resume: c.resume })),
    unites: B_UNITES,
    parutionJours: r.parutionJours, base: r.base, depuis: b.depuis || "", cadenceAppliquee: b.cadence || "",
    prochaine: suivante ? { debut: suivante.debut, fin: suivante.fin, libelle: bLibellePeriode(suivante, r.cadence), parution: bDateParution(suivante, r) } : null,
    periodesExaminees: Object.keys(b.periodes).length,
    bulletins: bListe().length,
    bulletinsListe: bListe().map(bResume),
    apercu: bListe().find((x) => x.provisoire) || null,
    enAttente: b.file.length,
    abonnes: {
      total: Object.keys(b.abonnes).filter((k) => b.abonnes[k].etat !== "retire").length,
      confirmes: Object.keys(b.abonnes).filter((k) => b.abonnes[k].etat === "confirme").length,
      attente: Object.keys(b.abonnes).filter((k) => b.abonnes[k].etat === "attente").length,
      retires: Object.keys(b.abonnes).filter((k) => b.abonnes[k].etat === "retire").length,
    },
    abonnesListe: Object.keys(b.abonnes).map((k) => b.abonnes[k])
      .sort((a, c) => bComparer(c.creeLe, a.creeLe))
      .map((a) => ({ ...bResumeAbonne(a), lienDesabonnement: r.base ? bLienDesabonnement(a, r) : "" })),
    file: b.file.slice(0, 50),
    envois: b.envois.slice(-6).reverse(),
    courriel: {
      disponible: false, configure: false, actif: false, raison: B_MOTIF_SMTP,
      hote: "", port: 0, securise: "", expediteur: "", expediteurNom: r.expediteurNom, repondreA: r.repondreA, authentifie: false, derniers: [],
    },
    flux: { rss: (r.base || "") + "/recueil/bulletins.rss", atom: (r.base || "") + "/recueil/bulletins.atom" },
  };
}

// Le numéro en données : c'est ce que la page rend à « ?bulletin=<id> », et ce
// que le service sert à ses propres adresses.
function bJsonBulletin(b, base) {
  return {
    id: b.id, titre: b.titre, libelle: b.libelle, sousTitre: b.sousTitre || "",
    entete: b.entete || "", pied: b.pied || "",
    debut: b.debut, fin: b.fin, annee: b.annee, rang: b.rang, cadence: b.cadence,
    nombre: b.nombre, provisoire: b.provisoire === true, composeLe: b.composeLe,
    empreinte: b.empreinte,
    url: (base || "") + "/recueil/bulletins/" + encodeURIComponent(b.id),
    entites: (b.entites || []).map((e) => ({
      nom: e.nom, nombre: e.nombre,
      themes: e.themes.map((t) => ({
        id: t.id, label: t.label, nombre: t.nombre,
        actes: t.actes.map((a) => ({
          cle: a.cle, eliUri: a.eliUri, numero: a.numero, objet: a.objet, nature: a.nature,
          entityName: a.entityName, dateDocument: a.dateDocument, datePublication: a.datePublication,
          dateOpposabilite: a.dateOpposabilite, kind: a.kind, juridique: a.juridique,
          natureDoc: a.natureDoc, remplacee: !!a.remplacee,
          url: (base || "") + "/recueil/" + encodeURIComponent(a.cle),
        })),
      })),
    })),
  };
}

// --------------------------------------------------------------- les routes
function hBulletinsEtat() {
  return ok(200, bPublicEtat());
}

function hBulletinLire(ctx) {
  const b = bLire(ctx.params.id);
  if (!b) return err(404, "Bulletin inconnu : " + ctx.params.id, { code: "bulletin_inconnu" });
  return ok(200, bJsonBulletin(b, ""));
}

function hBulletinsTableau() {
  return ok(200, bTableauDeBord());
}

// La génération à la demande : les périodes échues, ou la période EN COURS
// (`enCours`) — le geste « paraître aujourd'hui », à titre provisoire.
function hBulletinsGenerer(ctx) {
  const corps = ctx.body && typeof ctx.body === "object" ? ctx.body : {};
  const r = bReglages();
  if (!r.actif) return err(409, "Le bulletin est éteint sur ce service : activez-le avant de générer.", { code: "bulletin_eteint" });
  const b = bEtat();
  if (corps.depuis && /^\d{4}-\d{2}-\d{2}$/.test(String(corps.depuis))) b.depuis = String(corps.depuis);
  if (corps.enCours) {
    const enCours = bPeriodeDe(today(), r.cadence);
    const bulletin = bComposerPeriode(enCours, r, { publications: bPublications(), provisoire: true });
    saveDb(db);
    if (!bulletin) return ok(200, { compose: [], message: "Aucun acte n'a encore été publié sur la période en cours : il n'y a pas de bulletin à composer." });
    return ok(201, { compose: [bulletin.id], bulletin: bResume(bulletin), message: "Le bulletin « " + bulletin.titre + " » est composé. Il deviendra définitif à la fin de la période, et sera alors adressé aux abonnés." });
  }
  const avant = new Set(Object.keys(b.periodes));
  const passe = bAssurer();
  const nouveaux = Object.keys(b.periodes).filter((k) => !avant.has(k) && b.periodes[k].bulletin);
  return ok(200, {
    compose: nouveaux, vides: passe.vides, publies: passe.publies, envois: passe.envois,
    bulletins: passe.composees.length,
    message: nouveaux.length
      ? nouveaux.length + " bulletin(s) composé(s)."
      : "Aucune période échue n'avait d'actes à rassembler : il n'y a rien de nouveau à composer.",
  });
}

function hBulletinEnvoyer(ctx) {
  const p = bEtat().periodes[ctx.params.id];
  if (!p || !p.bulletin) return err(404, "Bulletin inconnu : " + ctx.params.id, { code: "bulletin_inconnu" });
  if (p.bulletin.provisoire) return err(409, "Ce bulletin est provisoire : il ne s'envoie qu'une fois la période close.", { code: "bulletin_provisoire" });
  const n = bProgrammerInterne(p.bulletin);
  const envois = bViderFile();
  saveDb(db);
  return ok(200, {
    bulletin: p.bulletin.id, programme: n, envois,
    message: n
      ? n + " abonné(s) confirmé(s) : le bulletin part par courriel."
      : "Aucun abonné confirmé : le bulletin n'a personne à qui être adressé.",
  });
}

function hBulletinsAbonner(ctx) {
  const corps = ctx.body && typeof ctx.body === "object" ? ctx.body : {};
  const r = bAbonner({ courriel: corps.courriel || corps.email, nom: corps.nom });
  if (!r.ok) return err(r.status, r.motif, { code: "abonnement_refuse" });
  return ok(r.status, { abonne: { courriel: r.abonne.courriel, etat: r.abonne.etat }, envoye: r.envoye, motif: r.motif, message: r.message });
}

const bJetonDeLaRequete = (ctx) => (ctx.body && (ctx.body.jeton || ctx.body.token)) || (ctx.query && ctx.query.get("jeton"));

function hBulletinsConfirmer(ctx) {
  const r = bConfirmer(bJetonDeLaRequete(ctx));
  if (!r.ok) return err(r.status, r.motif, { code: "confirmation_invalide" });
  return ok(200, { confirme: true, abonne: r.abonne, desabonnement: r.desabonnement, message: "Votre abonnement est confirmé : vous recevrez chaque bulletin par courriel." });
}

function hBulletinsDesabonner(ctx) {
  const r = bDesabonner(bJetonDeLaRequete(ctx));
  if (!r.ok) return err(r.status, r.motif, { code: "desabonnement_invalide" });
  return ok(200, { desabonne: true, abonne: r.abonne, message: "Votre abonnement est résilié : aucun courriel ne vous sera plus adressé." });
}

function hBulletinsRetirerAbonne(ctx) {
  const r = bRetirerAbonne(ctx.params.id);
  if (!r.ok) return err(r.status, r.motif, { code: "abonne_inconnu" });
  return ok(200, { retire: true, abonne: r.abonne });
}

];

const eliKey = (p) => "eli:/fr/" + [p.code, p.annee, p.numero, p.entite].filter(Boolean).join("/");

// Les routes qui appartiennent à l'ATELIER : hors réseau autorisé, elles
// s'arrêtent à la porte (voir `route`). Les routes PUBLIQUES — santé, recueil,
// informations, état de l'accès — n'y passent jamais : un visiteur extérieur
// doit pouvoir lire le recueil.
const ATELIER_PUBLIC = new Set(["/v1/health", "/v1/", "/v1/atelier/acces", "/v1/informations"]);
const estRouteAtelier = (pathname) => {
  if (ATELIER_PUBLIC.has(pathname)) return false;
  if (/^\/v1\/db(\/|$)/.test(pathname)) return true;
  if (/^\/v1\/(journal|actes|signatures|auth|comptes|admin)(\/|$)/.test(pathname)) return true;
  return false;
};

// Les paramètres de requête, lus sans `URLSearchParams` : le moteur de
// démonstration (QuickJS) n'expose pas toujours les API du navigateur, et le
// service doit se contenter de ce qui est universel.
function parametresRequete(q) {
  const m = new Map();
  for (const part of String(q || "").split("&")) {
    if (!part) continue;
    const i = part.indexOf("=");
    const cle = i < 0 ? part : part.slice(0, i);
    const val = i < 0 ? "" : part.slice(i + 1);
    let k = cle;
    let v = val;
    try { k = decodeURIComponent(cle); v = decodeURIComponent(val.replace(/\+/g, " ")); } catch (e) { /* valeur brute */ }
    m.set(k, v);
  }
  return m;
}

function route(req, conn) {
  const method = String(req.method || "GET").toUpperCase();
  const path = String(req.path || "/");
  const q = path.indexOf("?");
  const clean = q >= 0 ? path.slice(0, q) : path;
  const query = parametresRequete(q >= 0 ? path.slice(q + 1) : "");
  const headers = req.headers || {};

  // La porte de l'ATELIER (1.5.3). Quand le service SAIT d'où vient l'appelant
  // et que l'accès est restreint à d'autres réseaux, les routes de l'atelier
  // s'arrêtent ici — un 403 explicite, jamais un 404 muet. Sur la plateforme,
  // aucune adresse ne parvient au service : la porte reste ouverte, et c'est
  // l'installation auto-hébergée qui décide (voir `atelierPermet`).
  const ouvre = atelierPermet(headers);
  if (!ouvre && estRouteAtelier(clean)) {
    const e = etatAtelier(ipDeLEntete(headers));
    return err(403, e.message, { code: "atelier_hors_reseau", ip: e.ip, interne: e.interne });
  }

  let cheminTrouve = false;
  for (const r of ROUTES) {
    const m = r.p.exec(clean);
    if (!m) continue;
    cheminTrouve = true;
    if (r.m !== method) continue;
    // `auth` nomme le rôle MINIMAL exigé ("lecteur"…"administrateur") ; `role`
    // permet une liste exacte (le prestataire de signature). Les routes de
    // collection n'ont pas de règle ici : leur sensibilité dépend du nom de la
    // collection, et le gestionnaire l'applique (voir DBC_LECTURE/ECRITURE).
    if (r.auth || r.role) {
      const bad = authFail(headers, r.role || (r.auth ? { min: r.auth } : null));
      if (bad) return bad;
    }
    if (r.ecrit && !allowWrite(conn)) {
      return err(429, "Trop de requêtes d'écriture : ralentissez (limite : 90 par minute).", { code: "trop_de_requetes" }, { "retry-after": "60" });
    }
    const params = { 0: m[0] };
    if (m[1] !== undefined) { params.id = m[1]; params.cle = m[1]; }
    if (m[2] !== undefined) { params.code = m[1]; params.annee = m[2]; params.numero = m[3]; params.entite = m[4]; }
    // `agent` : la requête porte-t-elle une clé de service ? Les publications
    // RÉSERVÉES AUX AGENTS (`reserve`) ne sont servies qu'à celles-là — et
    // seulement depuis une adresse autorisée quand l'accès est restreint.
    return r.f({ params, body: req.body, headers, conn, path: clean, query, agent: !!identiteDe(headers) && ouvre });
  }
  return cheminTrouve
    ? err(405, "Méthode " + method + " non autorisée sur " + clean, { code: "methode_non_autorisee" })
    : err(404, "Ressource inconnue : " + clean, { code: "ressource_inconnue" });
}

self.rpc = {
  api(infos, data) {
    const conn = (infos && infos.conn) || null;
    let req;
    try { req = JSON.parse(data); }
    catch (e) { return JSON.stringify({ status: 400, headers: {}, body: { erreur: "Requête illisible (JSON attendu)." } }); }
    let res;
    try { res = route(req, conn); }
    catch (e) {
      console.log("Erreur interne :", String(e && e.stack || e));
      res = { status: 500, headers: {}, body: { erreur: "Erreur interne du service." } };
    }
    return JSON.stringify({
      status: res.status,
      headers: {
        "content-type": "application/json; charset=utf-8",
        "x-service": SERVICE,
        // Durcissement HTTP : le corps d'une réponse d'API ne doit jamais être
        // interprété comme un autre type, ni mis en cache (il peut refléter un
        // état qui vient de changer), ni transmettre l'URL appelante.
        "x-content-type-options": "nosniff",
        "cache-control": "no-store",
        "referrer-policy": "no-referrer",
        ...(res.headers || {}),
      },
      body: res.body,
    });
  },
  ping() { return "pong"; },
};
</script>
