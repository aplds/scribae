# ============================================================================
# Scribae — déploiement auto-hébergé (Docker Compose).
#
#   db    MariaDB : le référentiel, les trames, les actes, les comptes, l'état
#         de signature et de publication. Données dans le volume « donnees ».
#   db-init une passe unique AVANT le service : elle aligne le compte applicatif
#         de la base sur le `.env` et applique le schéma, puis s'arrête (exit 0).
#   api   le service de la collectivité (Node) : API /v1/… — données et actes.
#   web   nginx : sert l'application et fait proxy vers api sur /v1/.
#
# Toutes les valeurs viennent du fichier .env (voir env.example) : rien de
# secret n'est écrit ici. Démarrage :
#
#   cp .env.example .env      # puis renseignez les mots de passe et les jetons
#   docker compose up -d --build
#   docker compose logs -f api
#
# L'application répond ensuite sur http://<l'hôte>:${HTTP_PORT:-8080}.
#
# AUCUN FICHIER DE L'HÔTE N'EST MONTÉ DANS LES CONTENEURS. `api` et `web` sont
# CONSTRUITS (le code, la façade et le schéma entrent dans les images) : le
# démarrage ne dépend donc ni des droits des fichiers, ni du système de
# fichiers, ni de l'étiquette de sécurité (SELinux, AppArmor) de la machine qui
# déploie. Un montage de fichiers rendait jusqu'ici la façade impossible à
# démarrer sur ces machines-là — nginx refusait de lire sa configuration, sans
# que le dépôt n'y puisse rien. Voir web/Dockerfile et README.md § 9.
# ============================================================================

services:
  db:
    # Épinglée par EMPREINTE : l'étiquette `mariadb:11` seule désigne ce que le
    # registre publie ce jour-là — deux installations à deux dates différentes
    # ne partent alors pas du même logiciel. Reprendre l'étiquette courante :
    # `docker buildx imagetools inspect mariadb:11`.
    image: mariadb:11@sha256:79d59758afc91b89b120b0a8904d637f5a3b3e1c4900f29b740d6d46c72fef68
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?renseignez DB_ROOT_PASSWORD dans .env}
      MARIADB_DATABASE: ${DB_NAME:-scriba}
      MARIADB_USER: ${DB_USER:-scriba}
      MARIADB_PASSWORD: ${DB_PASSWORD:?renseignez DB_PASSWORD dans .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - donnees:/var/lib/mysql
      # PAS de script d'amorçage monté ici : le SCHÉMA appartient au SERVICE, et
      # c'est lui qui l'applique — le service `db-init` ci-dessous (compte
      # applicatif PUIS schéma, à chaque démarrage), puis `AUTO_MIGRATE` (voir le
      # service `api` plus bas), ou « node server.mjs --migrate » à la main.
      # `schema.sql` est idempotent (CREATE TABLE IF NOT EXISTS + vues) : il ne
      # supprime rien, et l'appliquer à chaque démarrage est sans effet sur les
      # données. Deux raisons de faire ainsi plutôt que de monter le fichier dans
      # /docker-entrypoint-initdb.d/ :
      #   — MariaDB ne rejoue ses scripts d'amorçage que sur un dossier de
      #     données VIERGE : un dossier initialisé avant le montage reste
      #     définitivement sans tables (c'est la panne d'installation la plus
      #     fréquente, et elle est silencieuse) ;
      #   — un fichier monté est un fichier de l'hôte : sur une machine qui
      #     refuse cette lecture (SELinux, système de fichiers, espace de noms),
      #     l'amorçage échoue sans que rien ne le dise.
      # Une base EXTERNE (DB_HOST vers un autre serveur) marche de la même
      # façon : elle reçoit le schéma du service.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interne]

  api:
    build: ./mysql
    restart: unless-stopped
    # TOUT le `.env` est transmis au service. Les variables listées ci-dessous
    # sont celles dont le défaut ou le rôle mérite une explication ; les autres —
    # notamment les réglages DÉCLARATIFS `SCRIBA_*` (identité, vocabulaire,
    # numérotation, délais, recueil, fonctions, voir env.example et
    # src/docs/VARIABLES.md) — arrivent par ce fichier, sans avoir à être
    # recopiées ici : le registre (src/server/mysql/variables.mjs) en est la
    # source de vérité, et rien ne doit être tenu en double.
    env_file:
      - .env
    environment:
      PORT: "8080"
      # Adresse et port de la base. Un `.env` qui les renseigne l'emporte — c'est
      # ainsi qu'on branche une base HORS de cette pile (voir README.md § 5) ;
      # sans réglage, c'est le service `db` du compose.
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-scriba}
      DB_PASSWORD: ${DB_PASSWORD:?renseignez DB_PASSWORD dans .env}
      DB_NAME: ${DB_NAME:-scriba}
      DB_POOL: ${DB_POOL:-8}
      # --- Mode d'authentification -------------------------------------------
      # `demo`     : comptes de l'application (liste, sans mot de passe) + jetons
      #              d'API — c'est le mode d'essai ;
      # `password` : comptes locaux, votés par un mot de passe (le SERVICE les
      #              vérifie), session par cookie. Les jetons d'API n'y sont plus
      #              acceptés. Voir env.example.
      # Le DÉFAUT est « password » : une installation qui démarre sans réglage
      # ne s'ouvre pas sur des comptes sans mot de passe. Pour un essai,
      # renseignez explicitement AUTH_MODE=demo dans .env.
      AUTH_MODE: ${AUTH_MODE:-password}
      # Comptes de démonstration (choix d'un compte sans mot de passe) : par
      # défaut allumés en mode demo, éteints en mode password. À éteindre en
      # service.
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-}
      # LE COMMUTATEUR DE DÉMONSTRATION. Allumé, le jeu fictif est installé
      # (identité, entités, services, personnes, rôles, trames, actes et comptes
      # de démonstration) ; éteint, l'outil est une page vierge, et un
      # administrateur construit son référentiel à partir de zéro. Vide = le mode
      # décide (« demo » l'allume, « password » l'éteint). Voir src/lib/demo.js.
      DEMO: ${DEMO:-}
      # Compte d'administration créé au premier démarrage (mode password).
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOM: ${ADMIN_NOM:-Administrateur}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_ENTITY: ${ADMIN_ENTITY:-}
      SESSION_DAYS: ${SESSION_DAYS:-12}
      MDP_MIN_LONGUEUR: ${MDP_MIN_LONGUEUR:-12}
      SCRYPT_N: ${SCRYPT_N:-65536}
      # LE DÉRIVÉ DE MOT DE PASSE S'EXÉCUTE SUR LE POOL DE FILS DE NODE, qui en
      # compte 4 par défaut. C'est ce pool qui décide combien de connexions
      # simultanées avancent ensemble : à 4 fils, vingt agents qui se connectent
      # dans la même minute attendent en six vagues (mesuré : la file d'attente
      # est le seul reste de l'ancien gel — voir docs/PERFORMANCE.md). 8 ou 16
      # pour une collectivité où l'affluence du matin est réelle. Variable de
      # Node, lue au LANCEMENT : elle ne se change pas à chaud.
      # ATTENTION À LA MÉMOIRE : un dérivé réclame ~64 Mio aux valeurs par défaut
      # (128·SCRYPT_N·r), et les dérivés EN COURS se cumulent — 8 fils ≈ 512 Mio,
      # 16 fils ≈ 1 Gio. Sur une petite machine, baissez SCRYPT_N plutôt que
      # d'ouvrir le pool.
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-4}
      # À LAISSER À `true` en production (HTTPS). Sur un essai en clair
      # (http://serveur:8080), le navigateur refuserait le cookie de session.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # « libellé:empreinte_sha256 » — la liste des jetons acceptés en écriture.
      # Obligatoire en mode `demo` ; sans objet en mode `password` (la session
      # remplace le jeton), où l'on peut laisser vide.
      API_TOKENS: ${API_TOKENS:-}
      # Origines autorisées à appeler l'API depuis un NAVIGATEUR. L'application
      # est servie par la même origine : laisser VIDE est le réglage par défaut
      # — aucun en-tête CORS n'est alors posé, et aucun autre site ne peut
      # appeler l'API pour le compte d'un agent. « * » n'a de sens que si un
      # site tiers doit réellement interroger l'API.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_BODY: ${MAX_BODY:-8388608}
      # LE SCHÉMA EST APPLIQUÉ PAR LE SERVICE. Allumé par défaut dans cette pile
      # (aucun script d'amorçage n'est monté dans MariaDB — voir le service `db`
      # ci-dessus), `schema.sql` est appliqué à chaque démarrage : il est
      # idempotent et n'efface rien, et c'est ce qui rend une installation neuve
      # utilisable du premier coup, même si le dossier de données existait déjà.
      # Il l'est AUSSI quand le service se rétablit après une panne de base (il
      # rééprouve la base à la demande) : inutile de recréer le conteneur.
      # Le repasser à `false` sur une base en service est possible : lancez alors
      # « docker compose exec api node server.mjs --migrate » après une mise à
      # jour du schéma.
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        # LE COMPTE EST ALIGNÉ — ET LE SCHÉMA APPLIQUÉ — AVANT QUE LE SERVICE NE
        # SE CONNECTE (voir le service `db-init` ci-dessous).
        # `service_completed_successfully` attend la FIN de son travail :
        # `service_started` ne suffirait pas — le compte serait peut-être encore
        # l'ancien au premier appel du service, et les tables encore absentes.
        condition: service_completed_successfully
    networks: [interne]

  db-init:
    # LE COMPTE APPLICATIF SUIT LE `.env`, ET LE SCHÉMA SUIT LE COMPTE.
    #
    # MariaDB crée le compte applicatif au PREMIER démarrage d'un dossier de
    # données VIERGE, et jamais ensuite : changer `DB_PASSWORD` dans le `.env` ne
    # change alors plus rien en base, et le service se voit refuser l'accès
    # (« Access denied for user 'scriba'@… ») alors que le `.env` est correct.
    # C'est la panne d'installation la plus fréquente — celle qui laisse croire
    # que le mot de passe est faux alors qu'il n'a simplement jamais été posé.
    # Ce service la supprime : il remet le compte au mot de passe du `.env`.
    #
    # IL APPLIQUE ENSUITE `schema.sql`, avec le compte qui vient d'être aligné.
    # Les deux pannes vont en effet de pair : une base dont le compte était refusé
    # n'a jamais reçu son schéma (l'application n'avait pas de quoi le créer), et
    # une réparation qui s'arrêterait au compte laisserait l'exploitant devant
    # « Table 'scriba.sb_record' doesn't exist » au premier écran. `schema.sql` ne
    # contient que des `CREATE TABLE IF NOT EXISTS` et des vues : l'appliquer ne
    # DÉTRUIT rien, même sur une base en service.
    #
    # C'est le SEUL moment où le service parle à la base en ROOT (il lit
    # DB_ROOT_PASSWORD pour cela). Voir mysql/compte-base.mjs, qui construit les
    # ordres du compte, et `node server.mjs --reconcilier`, qui les exécute puis
    # applique le schéma.
    #
    # Il vise la base de CETTE pile (`db`) : une base EXTERNE (DB_HOST vers un
    # autre serveur) n'est jamais modifiée par cette pile — l'alignement s'y fait
    # à la main, avec la même commande, depuis un conteneur du service.
    #
    # Il réussit TOUJOURS (`restart: "no"`, code de sortie 0) : s'il n'a pas pu
    # aligner le compte, il le DIT dans le journal, et le service démarre quand
    # même — il journalisera de son côté l'état réel de la base, plutôt que de
    # laisser la pile entière en panne pour un mot de passe.
    build: ./mysql
    restart: "no"
    command: ["node", "server.mjs", "--reconcilier"]
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-scriba}
      DB_PASSWORD: ${DB_PASSWORD:?renseignez DB_PASSWORD dans .env}
      DB_NAME: ${DB_NAME:-scriba}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?renseignez DB_ROOT_PASSWORD dans .env}
    depends_on:
      db:
        condition: service_healthy
    networks: [interne]

  web:
    # CONSTRUITE, et non un simple montage (voir web/Dockerfile) : les réglages
    # d'nginx, le script d'amorçage, la coquille ET le code de l'application
    # entrent dans l'image, avec leurs droits. Le contexte est la RACINE du
    # dépôt — c'est ce qui laisse copier `src/` ; l'image de base y est épinglée
    # par empreinte (voir la note du service `db` ci-dessus).
    build:
      context: ../..
      dockerfile: src/server/web/Dockerfile
    restart: unless-stopped
    environment:
      # Adresse de l'API telle que la voit le navigateur. Vide = même origine.
      API_BASE: ${API_BASE:-}
      # Jeton d'écriture remis à l'application (lecture des données publiques
      # comprise sans lui). Il doit correspondre à une empreinte de API_TOKENS.
      # Sans objet en mode `password` : l'application n'a alors que son cookie de
      # session.
      API_TOKEN: ${API_TOKEN:-}
      # Mode d'authentification, tel qu'il est annoncé au NAVIGATEUR (voir
      # web/config.js.template et web/host.js) — c'est lui qui apprend à
      # l'application, AVANT son premier appel, que la porte est une session et
      # non un jeton. Le mode du service (GET /v1/auth/config) reste
      # autoritaire ; celui-ci n'évite qu'un aller-retour. Il doit valoir le
      # DÉFAUT DU SERVICE (`password`, voir le service `api` ci-dessus) : sans
      # cela, un `.env` qui ne dit rien laisserait le navigateur croire à un
      # jeton, et ses écritures seraient refusées (403, anti-CSRF absent) alors
      # que les lectures passeraient.
      AUTH_MODE: ${AUTH_MODE:-password}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-}
      # Le commutateur de démonstration (`DEMO`), tel qu'il est annoncé au
      # navigateur (voir web/config.js.template et web/host.js). Vide = présage
      # absent ; le service (GET /v1/auth/config) reste autoritaire.
      DEMO: ${DEMO:-}
    volumes:
      # La racine servie par nginx : la coquille et `config.js` y sont déposés à
      # chaque démarrage par le script d'amorçage (le volume survit à la
      # recréation du conteneur). Rien d'autre n'y entre.
      - webroot:/srv/www
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on: [api]
    networks: [interne]

volumes:
  donnees:
  webroot:

networks:
  interne:
    driver: bridge
