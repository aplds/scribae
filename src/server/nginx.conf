# ============================================================================
# Scribae — façade HTTP (nginx).
#
#   /            la coquille de l'application auto-hébergée (web/index.html)
#   /src/…       le code de l'application, servi tel quel depuis le dépôt
#   /v1/…        l'API du service (données + signature/publication) → conteneur api
#
# Le conteneur « api » n'expose aucun port : l'API n'est joignable qu'à travers
# cette façade, donc depuis le même domaine que l'application (pas de CORS).
# ============================================================================

server {
  listen 80;
  server_name _;
  charset utf-8;

  root /srv/www;
  index index.html;

  # Le jeton et l'adresse de l'API ne doivent jamais être mis en cache.
  # Les en-têtes de durcissement sont REPRIS ici, et non hérités : nginx
  # n'hérite pas des `add_header` d'un niveau supérieur dès qu'un `add_header`
  # est déclaré dans le bloc `location` (tout ou rien).
  location = /config.js {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
  }

  # Code de l'application (modules ES, feuilles de style). Servi depuis le dépôt
  # monté en lecture seule : ce que voit le navigateur est exactement la source.
  location /src/ {
    root /srv/app;
    add_header Cache-Control "no-cache" always;
    # Repris (et non hérités) — voir la note de `/config.js` ci-dessus.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri =404;
  }

  # L'API du service.
  location /v1/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    client_max_body_size 16m;
  }

  # Le « recueil ouvert » : les adresses publiques que consultent les moteurs de
  # recherche et les agents (LLMs) — robots.txt, llms.txt, plan du site, index
  # JSON, la page publiée de chaque acte, et l'identifiant ELI comme adresse
  # (/eli/…, qui mène à l'acte). Le service les tient (il détient les
  # publications) mais elles appartiennent au domaine du SITE : la coquille de
  # l'application ne doit pas les intercepter (voir src/server/mysql/actes.mjs).
  location = /robots.txt   { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /llms.txt     { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /sitemap.xml  { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /recueil.json { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /recueil        { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /eli            { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

  # Coquille + ressources du déploiement (host.js, favicon, config.js).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Un peu de durcissement, sans casser l'application (elle construit tout en
  # JS, et le recueil public affiche des actes).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  # Anti-détournement de cadre : la page ne se laisse pas encadrer par un autre
  # site. Cette politique CSP NE RESTREINT PAS les scripts ni les styles (elle
  # ne déclare que `frame-ancestors`) : elle est donc sans risque pour
  # l'application, contrairement à une CSP complète qui demande d'être éprouvée
  # déploiement par déploiement (les sources autorisées dépendent de ce que la
  # collectivité ajoute : polices, moteur de langage, etc.).
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}
