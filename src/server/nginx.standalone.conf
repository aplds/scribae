# ============================================================================
# Scribae — façade HTTP de l'IMAGE AUTONOME (voir Dockerfile).
#
# C'est le MIROIR de `nginx.conf`, à une différence près : le service et la
# façade tournent dans le MÊME conteneur, donc l'API est à `127.0.0.1:8080` au
# lieu du service `api` du réseau Docker.
#
# Toute modification de `nginx.conf` doit être reportée ici (et réciproquement) :
# les deux fichiers décrivent la même façade.
# ============================================================================

server {
  listen 80;
  server_name _;
  charset utf-8;

  root /srv/www;
  index index.html;

  # Le jeton et l'adresse de l'API ne doivent jamais être mis en cache.
  # Les en-têtes de durcissement sont REPRIS ici, et non hérités : nginx
  # n'hérite pas des `add_header` d'un niveau supérieur dès qu'un `add_header`
  # est déclaré dans le bloc `location` (tout ou rien).
  location = /config.js {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
  }

  # Code de l'application (modules ES, feuilles de style), embarqué dans l'image.
  location /src/ {
    root /srv/app;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri =404;
  }

  # L'API du service, dans ce même conteneur.
  location /v1/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    client_max_body_size 16m;
  }

  # Le « recueil ouvert » : les adresses publiques que consultent les moteurs de
  # recherche et les agents (LLMs) — robots.txt, llms.txt, plan du site, index
  # JSON, la page publiée de chaque acte, et l'identifiant ELI comme adresse.
  location = /robots.txt   { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /llms.txt     { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /sitemap.xml  { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /recueil.json { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /recueil        { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /eli            { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

  # Coquille + ressources du déploiement (host.js, favicon, config.js).
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}
